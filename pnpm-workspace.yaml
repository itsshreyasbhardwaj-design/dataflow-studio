packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 fails an install when a dependency wants to run a build script that is
# neither approved nor explicitly declined. esbuild (pulled in by Vitest and
# Next) ships prebuilt platform packages, so its postinstall is unnecessary -
# the test suite and the production build both pass without it.
allowBuilds:
  esbuild: false
  sharp: true
  "@tailwindcss/oxide": true

# next pins postcss to 8.4.31, which is behind four published advisories
# (GHSA-fxqj-rqcc-2cmp and its predecessors). postcss is patch-compatible here -
# it is only used to process the Tailwind stylesheet at build time - so the
# override lifts the whole tree onto a fixed release.
overrides:
  postcss: "^8.5.28"
