name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-disclosed advisory in a dependency is noticed without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  adversarial-tests:
    name: Adversarial test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages

      - name: Cross-tenant, SSRF, injection, secret-leakage and RBAC tests
        run: pnpm vitest run tests/security.test.ts apps/api packages/secrets packages/connectors

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Audit for known advisories
        # Moderate and above fails the build; the report is printed either way.
        run: pnpm audit --audit-level moderate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the working tree for committed credentials
        run: |
          # A deliberately narrow scan: real credential shapes, not every string
          # that happens to contain the word "key".
          set +e
          MATCHES=$(grep -rInE \
            -e '(sk-[A-Za-z0-9_-]{20,})' \
            -e '(gh[pousr]_[A-Za-z0-9]{30,})' \
            -e '(AKIA[0-9A-Z]{16})' \
            -e '(xox[abprs]-[A-Za-z0-9-]{20,})' \
            -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            -e '(postgres|postgresql|mysql)://[^:/@\s]+:[^@\s]{8,}@' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            --exclude-dir=.next --exclude=pnpm-lock.yaml \
            . )
          set -e
          if [ -n "$MATCHES" ]; then
            echo "Possible credentials committed to the repository:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No credential patterns found."

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
